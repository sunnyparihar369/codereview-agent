[project]
name = "codereview-agent"
version = "0.1.0"
description = "Multi-agent automated code review system for enterprise repositories"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings==2.5.2",
    "httpx==0.28.1",
    "python-gitlab==5.6.0",
    "PyGithub==2.6.1",
    "langchain-core>=1.6.0,<2.0.0",
    "langgraph>=0.3.0,<1.0.0",
    "langsmith>=0.3.45,<1.0.0",
    "openai>=1.54.0,<2.0.0",
    "anthropic>=0.39.0,<0.40.0",
    "google-generativeai>=0.8.0,<1.0.0",
    "tiktoken==0.8.0",
    "prometheus-client==0.20.0",
    "structlog==24.1.0",
    
    "tenacity==8.5.0",
    "pyyaml==6.0.1",
    "python-multipart==0.0.9",
    "langchain-google-genai (>=4.4.2,<5.0.0)",
    "python-json-logger (>=4.2.0,<5.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "pytest-cov==6.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "PT", "TID", "PYI", "SIM", "ARG", "PTH", "ERA", "PL", "TRY"]
ignore = ["S101", "TRY003", "PTH123"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
include = [{ from = "app" }]
[[tool.poetry.packages]]
include = "app"
[tool.poetry]
package-mode = false
